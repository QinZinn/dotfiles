$font = JetBrainsMono Nerd Font

general {
    hide_cursor = false
    ignore_empty_input = true
}

animations {
    enabled = true
    bezier = nordOut, 0.16, 1.0, 0.30, 1.0
    animation = fadeIn, 1, 5, nordOut
    animation = fadeOut, 1, 5, nordOut
    animation = inputFieldDots, 1, 2, nordOut
}

background {
    monitor =
    path = screenshot
    color = rgb(2e3440)
    blur_passes = 3
    blur_size = 8
    brightness = 0.72
    contrast = 0.92
    noise = 0.0117
}

input-field {
    monitor =
    size = 22%, 5%
    outline_thickness = 3
    inner_color = rgba(46, 52, 64, 0.88)
    outer_color = rgba(136, 192, 208, 0.95)
    check_color = rgba(163, 190, 140, 0.95)
    fail_color = rgba(191, 97, 106, 0.95)
    font_color = rgb(216, 222, 233)
    fade_on_empty = false
    rounding = 14
    font_family = $font
    placeholder_text = Enter password...
    fail_text = $PAMFAIL
    dots_spacing = 0.3
    position = 0, -20
    halign = center
    valign = center
}

label {
    monitor =
    text = $TIME
    font_size = 92
    font_family = $font
    color = rgb(d8dee9)
    position = -44, -12
    halign = right
    valign = top
}

label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B %Y"
    font_size = 22
    font_family = $font
    color = rgb(136, 192, 208)
    position = -50, -142
    halign = right
    valign = top
}
